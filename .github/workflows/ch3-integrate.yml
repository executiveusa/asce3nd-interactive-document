name: Integrate Chapter 3
on:
  push:
    branches:
      - feat/chapter-3-workbook-integration
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chapter-3-workbook-integration
      - name: Patch workbook navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='var STEPS=["welcome","followup","ch1","strategy","basics","mission","audience","voice","story","pillars","platforms","roadmap","rhythm","engagement","measurement","risk","summary","ch2_hero","ch2_cover","ch2_truth","ch2_responsibilities","ch2_runshow","ch2_operations","ch2_founder_prep","ch2_interview","ch2_readiness","ch2_eventday","ch2_results","ch2_buildon"];'
          new='var STEPS=["welcome","followup","ch1","strategy","basics","mission","audience","voice","story","pillars","platforms","roadmap","rhythm","engagement","measurement","risk","summary","ch2_hero","ch2_cover","ch2_truth","ch2_responsibilities","ch2_runshow","ch2_operations","ch2_founder_prep","ch2_interview","ch2_readiness","ch2_eventday","ch2_results","ch2_buildon","ch3_entry"];'
          assert old in s, 'STEPS anchor missing'
          s=s.replace(old,new,1)
          old="'ch2_buildon':'Stage 5 — Build On It'};"
          new="'ch2_buildon':'Stage 5 — Build On It','ch3_entry':'Chapter 3 — Month 1 Social System'};"
          assert old in s, 'title-map anchor missing'
          s=s.replace(old,new,1)
          old="  if(['ch2_hero','ch2_cover','ch2_truth','ch2_responsibilities','ch2_runshow','ch2_operations','ch2_founder_prep','ch2_interview','ch2_readiness','ch2_eventday','ch2_results','ch2_buildon'].indexOf(id)>-1) {\n    return t('Chapter 2 - The Event');\n  }\n  return '';"
          new="  if(['ch2_hero','ch2_cover','ch2_truth','ch2_responsibilities','ch2_runshow','ch2_operations','ch2_founder_prep','ch2_interview','ch2_readiness','ch2_eventday','ch2_results','ch2_buildon'].indexOf(id)>-1) {\n    return t('Chapter 2 - The Event');\n  }\n  if(id==='ch3_entry') return t('Chapter 3 - Month 1 Social System');\n  return '';"
          assert old in s, 'chapter-label anchor missing'
          s=s.replace(old,new,1)
          entry="""
function rCh3Entry(){
  return '<div style="background:#0a0a0a;color:#fff;border-radius:18px;padding:clamp(30px,6vw,58px);min-height:480px;display:flex;flex-direction:column;justify-content:flex-end">'+
    '<div style="font:800 12px \'Barlow Condensed\',sans-serif;letter-spacing:.18em;color:var(--gold);margin-bottom:10px">'+t('CHAPTER 03')+'</div>'+
    '<h3 style="font:800 clamp(44px,8vw,72px)/.9 \'Barlow Condensed\',sans-serif;letter-spacing:-.03em;margin:0 0 18px">'+t('Month 1 Social System')+'</h3>'+
    '<p style="max-width:620px;color:rgba(255,255,255,.72);font-size:15px;line-height:1.6;margin:0 0 24px">'+t('Turn the strategy into a repeatable publishing system: weekly rhythm, visual rhythm, the first-month calendar, Wednesday Reels, and the handoff rules ASC3ND can keep using.')+'</p>'+
    '<div><a class="cta-btn" href="./chapter-3.html" style="display:inline-block;text-decoration:none">'+t('Open Chapter 3')+' '+icon('arrow-right','sm')+'</a></div>'+
  '</div>';
}

"""
          anchor='/* ══ NAVIGATION ══════════════════════════════════════════════════════ */'
          assert anchor in s, 'navigation anchor missing'
          s=s.replace(anchor,entry+anchor,1)
          old="  else if(id==='ch2_buildon')h=rCh2Buildon();\n  else{var sec=sById(id);"
          new="  else if(id==='ch2_buildon')h=rCh2Buildon();\n  else if(id==='ch3_entry')h=rCh3Entry();\n  else{var sec=sById(id);"
          assert old in s, 'render anchor missing'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/ch3-integrate.yml
          git config user.name "ASC3ND Workbook Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/ch3-integrate.yml
          git commit -m "feat: wire Chapter 3 into workbook navigation"
          git push origin HEAD:feat/chapter-3-workbook-integration
